version: '3.9'
services:
  running_on_dart:
    image: ghcr.io/nyxx-discord/running_on_dart:4.10.0-dev.0
    container_name: running_on_dart
    env_file:
     - .env
    depends_on:
      - db
    volumes:
      - "rod_sessions:/sessions"
    networks:
      - internal
      - nginx-proxy_default

  db:
    image: postgres:17
    container_name: running_on_dart_db
    restart: always
    env_file:
      - .env
    volumes:
      - "rod_db_17:/var/lib/postgresql/data"
    networks:
      - internal

volumes:
  rod_db_17:
  rod_sessions:

networks:
  nginx-proxy_default:
    name: nginx-proxy_default
    external: true
  internal:
