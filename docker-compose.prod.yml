version: '3.9'
services:
  running_on_dart:
    image: ghcr.io/nyxx-discord/running_on_dart:4.10.1
    container_name: running_on_dart
    depends_on:
      - db
    networks:
      - internal

  db:
    image: postgres:17
    container_name: running_on_dart_db
    restart: always
    volumes:
      - "rod_db_17:/var/lib/postgresql/data"
    networks:
      - internal

volumes:
  rod_db_17:
  rod_sessions:

networks:
  internal:
