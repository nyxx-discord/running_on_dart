version: '3.9'
services:
  running_on_dart:
    image: ghcr.io/nyxx-discord/running_on_dart:4.22.0
    container_name: running_on_dart
    restart: unless-stopped
    ports:
      - "44333:8088"
    depends_on:
      - db
    env_file:
      - stack.env

  db:
    image: postgres:17
    container_name: running_on_dart_db
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - "rod_db_17:/var/lib/postgresql/data"

volumes:
  rod_db_17:
  rod_sessions:
