version: '3.9'
services:
  running_on_dart:
    image: ghcr.io/nyxx-discord/running_on_dart:4.7.0-dev.1
    container_name: running_on_dart
    env_file:
     - .env
    links:
      - db
    depends_on:
      - db
    networks:
      - nginx-proxy_default

  db:
    image: postgres:17
    container_name: running_on_dart_db
    restart: always
    env_file:
      - .env
    volumes:
      - "rod_db_17:/var/lib/postgresql/data"

volumes:
  rod_db_17:

networks:
  nginx-proxy_default:
    name: nginx-proxy_default
    driver: bridge
