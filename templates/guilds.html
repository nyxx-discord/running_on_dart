<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Running on Dart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
<nav hx-get="/hx?c=navigation" hx-swap="outerHTML" hx-trigger="load"></nav>

<div class="container">
    <div hx-get="/hx?c=alert" hx-swap="outerHTML" hx-trigger="load"></div>

    <div class="container">
        <div class="grid">
        {{#guilds}}
            <div class="card col m-1">
                <div class="card-body">
                    <h5 class="card-title">
                        <img src="https://media.discordapp.net/icons/{{id}}/{{icon}}.png?size=32" alt="Profile Picture" class="rounded-circle inline m-1" onerror="this.style.display='none'">
                        {{name}}
                    </h5>

                    <p class="card-text"><span class="fw-bold">{{cached_members}}</span> Cached members <span class="fw-bold ms-3">{{cached_channels}}</span> Cached channels</p>
                </div>
            </div>
        {{/guilds}}
        </div>
    </div>
</div>
</body>
</html>
